[build-system]
requires = [
    "setuptools>=42",
    "wheel",
	"setuptools_scm>=6.2"]

build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/KiMoPack/_version.py"

[project]
name = "KiMoPack"
authors = [{name = "Jens Uhlig", email = "jens.uhlig@chemphys.lu.se"}]
description = "A comprehensive package for the analysis of kinetic data."
readme = "README.rst"
requires-python = ">=3.11"
dynamic= ["version"]

classifiers =[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Physics",
    "Framework :: Jupyter"]
dependencies =[
    "pandas>=1.4",
    "tables",
    "tabulate",
    "h5py>=3.1",
    "matplotlib>=3.3",
    "numpy>=1.19",
    "lmfit>=1.0",
    "scipy>=1.5",
    "urllib3"]

# Imported lazily and guarded at the call site: PowerPoint export and the
# keyboard interrupt for long fits work only when these are present.
[project.optional-dependencies]
powerpoint = ["python-pptx>=0.6.18"]
interrupt = ["keyboard"]

[project.urls]
"Bug Tracker"="https://github.com/erdzeichen/KiMoPack/issues"
"Repository"="https://github.com/erdzeichen/KiMoPack"
"Homepage"="https://www.chemphys.lu.se/research/projects/kimopack/"
"Documentation"="https://kimopack.readthedocs.io/"

[tool.setuptools]
package-dir = {""="src"}
packages = ["KiMoPack"]

[dependency-groups]
dev = ["ruff>=0.12"]
docs = [
    "sphinx>=8.1",
    "sphinx_rtd_theme>=3.0",
    "readthedocs-sphinx-search>=0.3.2"]

[tool.ruff]
line-length = 120
extend-exclude = ["Tutorial_Notebooks", "Workflow_tools", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I", "E722"]

[tool.ruff.lint.per-file-ignores]
# plot_func.py predates this config and is being dismantled module by module.
# Style rules are silenced so the gate stays green on code nobody is rewriting
# yet, but the correctness rules that matter (F821 undefined-name, most of F)
# stay on: they already caught two live bugs. Each extracted module leaves this
# exemption automatically, since the ignore is scoped to this one path.
# F401/F403 are permanent here — the facade re-exports the public API on purpose.
"src/KiMoPack/plot_func.py" = ["F401", "F403", "F841", "E7", "UP", "B", "I001"]
"src/KiMoPack/__init__.py" = ["F401", "UP", "I001"]
