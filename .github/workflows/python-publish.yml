name: Upload Python Package to PyPI

# The version comes from the tag via setuptools_scm, so a release is made by
# tagging. Building from an untagged commit produces a local version
# identifier (1.2.3.dev4+gabc123) that PyPI refuses.
on:
  push:
    tags:
      - '*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    # Forks run the tests but must never attempt an upload: the credential is
    # not theirs, and a tag copied along with the fork should not ship anything.
    if: github.repository == 'erdzeichen/KiMoPack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Without the full history setuptools_scm cannot see the tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish --token ${{ secrets.PIPYKIMOPACKDEPLOY }}
